<main>

<section>

<h1>Contact Us</h1>

<p>

We'd love to hear from you! Fill out the form below and we'll get back to you soon.

</p>

</section>

<section>

<form id="contactForm">

<div>

<label for="name">Full Name *</label>

<input
type="text"
id="name"
name="name"
required>

</div>

<div>

<label for="email">Email Address *</label>

<input
type="email"
id="email"
name="email"
required>

</div>

<div>

<label for="favorite">Favorite Cookie</label>

<select id="favorite" name="favorite">

<option value="">Choose One</option>

<option>Classic Chocolate Chip</option>

<option>Oatmeal Raisin</option>

<option>Sugar Cookie</option>

<option>Double Chocolate</option>

<option>Peanut Butter</option>

<option>Snickerdoodle</option>

</select>

</div>

<div>

<label for="message">Message *</label>

<textarea
id="message"
name="message"
required></textarea>

</div>

<input type="submit" value="Send Message">

</form>

<div id="confirmation"></div>

</section>

</main>

<footer>
