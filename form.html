<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Product Review</title>
<meta name="description" content="Submit a review of your product by selecting a product, rating its quality, choosing useful features, and sharing your experience.">
<meta name="author" content="Rebecca">

<link rel="stylesheet" href="review.css">

<script src="review.js" defer></script>

</head>

<body>

<header>
<h1>Product Review</h1>
</header>

<main>

<form method="get" action="review.html">

<div class="form-group">

<label for="product">Product Name</label>

<select id="product" name="product" required>

<option value="" disabled selected>Select a Product ...</option>

</select>

</div>


<div class="form-group">

<label>Overall Rating</label>

<div class="stars">

<input type="radio" id="one" name="rating" value="1" required>
<label for="one">☆</label>

<input type="radio" id="two" name="rating" value="2" required>
<label for="two">☆☆</label>

<input type="radio" id="three" name="rating" value="3" required>
<label for="three">☆☆☆</label>

<input type="radio" id="four" name="rating" value="4" required>
<label for="four">☆☆☆☆</label>

<input type="radio" id="five" name="rating" value="5" required>
<label for="five">☆☆☆☆☆</label>
</div>

</div>


<div class="form-group">

<label for="install">Date of Installation</label>

<input
type="date"
id="install"
name="install"
required>

</div>


<div class="form-group">

<label>Which features did you find useful in the product?<br>
<span>Check all that apply</span>
</label>

<input type="checkbox" id="durability" name="features" value="Durability">
<label for="durability">Durability</label>

<input type="checkbox" id="ease" name="features" value="Ease of Use">
<label for="ease">Ease of Use</label>

<input type="checkbox" id="performance" name="features" value="Performance">
<label for="performance">Performance</label>

<input type="checkbox" id="design" name="features" value="Design">
<label for="design">Design</label>
</div>


<div class="form-group">

<label for="review">Written Review (Optional)</label>

<textarea
id="review"
name="review"
rows="6"></textarea>

</div>


<div class="form-group">

<label for="username">Your Name (Optional)</label>

<input
type="text"
id="username"
name="username">

</div>

<input
type="submit"
value="Post Review"
class="submit">

</form>

</main>

<footer>

<p>&copy;2026 🚀 Rebecca Vicente 🚀 Brazil</p>

<p id="lastModified"></p>

</footer>

</body>
</html>
