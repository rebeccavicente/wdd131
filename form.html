<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Product Review</title>
<meta name="description" content="Submit a product review.">
<meta name="author" content="Rebecca">

<link rel="stylesheet" href="review.css">

<script src="review.js" defer></script>

</head>

<body>

<header>
<h1>Product Review</h1>
</header>

<main>

<form method="get" action="review.html">

<div class="form-group">

<label for="product">Product Name</label>

<select id="product" name="product" required>

<option value="" disabled selected>Select a Product ...</option>

</select>

</div>


<div class="form-group">

<label>Overall Rating</label>

<div class="stars">

<label>
☆
<input type="radio" name="rating" id="one" value="1" required>
</label>

<label>
☆☆
<input type="radio" name="rating" id="two" value="2">
</label>

<label>
☆☆☆
<input type="radio" name="rating" id="three" value="3">
</label>

<label>
☆☆☆☆
<input type="radio" name="rating" id="four" value="4">
</label>

<label>
☆☆☆☆☆
<input type="radio" name="rating" id="five" value="5">
</label>

</div>

</div>


<div class="form-group">

<label for="install">Date of Installation</label>

<input
type="date"
id="install"
name="install"
required>

</div>


<div class="form-group">

<label>Which features did you find useful in the product?<br>
<span>Check all that apply</span>
</label>

<label><input type="checkbox" id="durability" name="features" value="Durability"> Durability</label>

<label><input type="checkbox" id="ease" name="features" value="Ease of Use"> Ease of Use</label>

<label><input type="checkbox" id="performance" name="features" value="Performance"> Performance</label>

<label><input type="checkbox" id="design" name="features" value="Design"> Design</label>

</div>


<div class="form-group">

<label for="review">Written Review (Optional)</label>

<textarea
id="review"
name="review"
rows="6"></textarea>

</div>


<div class="form-group">

<label for="username">Your Name (Optional)</label>

<input
type="text"
id="username"
name="username">

</div>

<input
type="submit"
value="Post Review"
class="submit">

</form>

</main>

<footer>

<p>&copy;2026 🚀 Rebecca Vicente 🚀 Brazil</p>

<p id="lastModified"></p>

</footer>

</body>
</html>
